<script>
(function(){
'use strict';
/* ---------- constants & helpers ---------- */
var TZ='Asia/Kolkata';
var PRODUCTS=[{k:'DTM',name:'Double Toned Milk'},{k:'TM',name:'Toned Milk'},{k:'Ghee',name:'Ghee'}];
var DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var DOWFULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DEFAULT_UNITS={DTM:'litres',TM:'litres',Ghee:'kg'};
var pad=function(n){return String(n).padStart(2,'0')};
function todayIso(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function nowStamp(){return new Intl.DateTimeFormat('en-GB',{timeZone:TZ,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()).replace(/\//g,'-').replace(',','')+' IST'}
function fmt(iso){return iso.split('-').reverse().join('-')}
function ymd(iso){return iso.split('-').map(Number)}
function addDays(iso,n){var a=ymd(iso);var t=new Date(Date.UTC(a[0],a[1]-1,a[2]+n));return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())}
function dow(iso){var a=ymd(iso);var g=new Date(Date.UTC(a[0],a[1]-1,a[2])).getUTCDay();return g===0?7:g}
function dim(ym){var a=ym.split('-').map(Number);return new Date(Date.UTC(a[0],a[1],0)).getUTCDate()}
function monthDays(ym){var n=dim(ym),o=[];for(var i=1;i<=n;i++)o.push(ym+'-'+pad(i));return o}
function monthLabel(ym){var a=ym.split('-').map(Number);return MONTHS[a[1]-1]+' '+a[0]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function q2(v){var n=Math.round(Number(v)*100)/100;return isNaN(n)?'':String(n)}
function unitS(u){return String(u||'').replace(/s$/i,'')}
function normName(s){return String(s||'').trim().replace(/\s+/g,' ').toLowerCase()}
function byName(a,b){return a.name.localeCompare(b.name,undefined,{sensitivity:'base'})}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function fileSafe(s){return String(s).replace(/[^A-Za-z0-9\-]+/g,'_').replace(/^_|_$/g,'')}
function $(s){return document.querySelector(s)}

/* ---------- state ---------- */
var S={
  tab:'daily', clients:[], settings:{dairyName:'Express Dairy',units:Object.assign({},DEFAULT_UNITS)}, settingsRaw:{},
  orders:{}, ready:{clients:false,settings:false}, readyM:{}, slow:false, readOnly:false,
  date:todayIso(), month:todayIso().slice(0,7), mprod:'ALL', q:'', sort:'asc', showArchived:false, assign:'', dAssign:'',
  booted:false, drafts:{}, alertDismissed:'', popupShown:false, repClient:'', repProd:'DTM', busy:''
};
var db=null, dl=null, subs={}, queue=Promise.resolve(), F=null, flashId=null;

function unit(p){return (S.settings.units&&S.settings.units[p])||DEFAULT_UNITS[p]}
function entryOf(date,cid){return (S.orders[date]||{})[cid]||null}
function isExpected(c,d){
  if(!(c.days||[]).includes(dow(d)))return false;
  if(c.activeFrom&&d<c.activeFrom)return false;
  if(c.archivedOn&&d>=c.archivedOn)return false;
  return true;
}
function dueClients(date){return S.clients.filter(function(c){return !c.archived&&isExpected(c,date)}).sort(byName)}
function matchAssign(c,a){if(!a)return true;if(a==='__none')return !(c.assignedTo||'').trim();return normName(c.assignedTo)===normName(a)}
function dueFiltered(date){return dueClients(date).filter(function(c){return matchAssign(c,S.dAssign)})}
function statusOf(date,cid){var e=entryOf(date,cid);return e?(e.status==='logged'?'logged':'none'):'pending'}
function pendingList(date){return dueClients(date).filter(function(c){return statusOf(date,c.id)==='pending'})}
function dataReady(){return S.ready.clients&&S.ready.settings&&S.readyM[S.date.slice(0,7)]}

/* ---------- storage layer ---------- */
function enqueue(fn){var run=queue.then(function(){return fn()});queue=run.catch(function(){});return run}
function errMsg(e){return (e&&(e.message||e.code))||'Something went wrong. Try again.'}
async function guard(p){try{await p;return true}catch(e){toast(errMsg(e),'bad');return false}}
function mutateOrders(date,fn){
  return enqueue(async function(){
    var ref=db.doc('orders/'+date);var snap=await ref.get();var cur=snap.exists?snap.data():null;
    var entries=Object.assign({},(cur&&cur.entries)||{});fn(entries);
    if(!Object.keys(entries).length){if(cur)await ref.delete()}
    else await ref.set({date:date,month:date.slice(0,7),entries:entries});
  });
}
function saveClientDoc(id,obj){var o=Object.assign({},obj);delete o.id;return enqueue(function(){return db.doc('clients/'+id).set(o)})}
function saveSettings(patch){
  var raw=Object.assign({},S.settingsRaw,patch);
  return enqueue(function(){return db.doc('settings/main').set(raw)});
}
function ensureMonth(ym){
  if(subs[ym]||!db)return;
  subs[ym]=db.collection('orders').where('month','==',ym).onSnapshot(function(snap){
    Object.keys(S.orders).forEach(function(k){if(k.indexOf(ym)===0)delete S.orders[k]});
    snap.docs.forEach(function(d){S.orders[d.id]=(d.data()||{}).entries||{}});
    S.readyM[ym]=true;afterData();
  },onErr);
}
function onErr(e){if(e&&e.code==='revoked')toast('Access to this page was changed. Reload to continue.','bad');else toast('Could not read data: '+errMsg(e),'bad')}
function subscribeBase(){
  db.collection('clients').onSnapshot(function(snap){
    S.clients=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    S.ready.clients=true;afterData();
  },onErr);
  db.doc('settings/main').onSnapshot(function(snap){
    var d=snap.exists?snap.data():{};S.settingsRaw=d;
    S.settings={dairyName:d.dairyName||'Express Dairy',units:Object.assign({},DEFAULT_UNITS,d.units||{})};
    S.ready.settings=true;afterData();
  },onErr);
  ensureMonth(S.date.slice(0,7));ensureMonth(S.month);
}
function afterData(){
  render();
  if(!S.popupShown&&dataReady()){
    S.popupShown=true;var p=pendingList(todayIso());
    if(p.length&&S.date===todayIso())showPopup(p);
  }
}

/* ---------- toast & confirm ---------- */
var toastT=null;
function toast(msg,kind){
  var t=$('#toast');t.innerHTML='<div class="toast '+(kind||'')+'" role="status">'+esc(msg)+'</div>';
  clearTimeout(toastT);toastT=setTimeout(function(){t.innerHTML=''},kind==='bad'?6000:3200);
}
function ask(title,msg,okLabel,danger){
  return new Promise(function(res){
    var c=$('#confirm');
    c.innerHTML='<div class="overlay"><div class="sheet" role="alertdialog" aria-modal="true" style="max-width:460px"><h3>'+esc(title)+'</h3><p style="margin:0 0 14px">'+esc(msg)+'</p><div class="foot"><button class="btn" type="button" id="cNo">Cancel</button><button class="btn '+(danger?'danger solid':'primary')+'" type="button" id="cYes">'+esc(okLabel)+'</button></div></div></div>';
    function done(v){c.innerHTML='';res(v)}
    $('#cNo').onclick=function(){done(false)};$('#cYes').onclick=function(){done(true)};$('#cNo').focus();
  });
}

/* ---------- rendering ---------- */
function render(){

/* ----- Clients tab ----- */
function clientMatches(c,q){
  if(!q)return true;q=q.toLowerCase();
  var hay=[c.name,c.billingName,c.address,c.assignedTo||''].concat((c.contacts||[]).map(function(x){return x.name+' '+x.phone+' '+(x.role||'')})).join(' ').toLowerCase();
  return hay.indexOf(q)>=0;
}
function daysText(d){d=(d||[]).slice().sort();if(d.length===7)return 'Every day';return d.map(function(x){return DOW[x-1]}).join(', ')}
function assignees(){
  var seen={},out=[];
  S.clients.forEach(function(c){var n=(c.assignedTo||'').trim();if(!n)return;var k=normName(n);if(!seen[k]){seen[k]=1;out.push(n)}});
  return out.sort(function(a,b){return a.localeCompare(b,undefined,{sensitivity:'base'})});
}

   '<select id="sortSel" data-sel="sort" style="width:auto" aria-label="Sort"><option value="asc"'+(S.sort==='asc'?' selected':'')+'>Name A–Z</option><option value="desc"'+(S.sort==='desc'?' selected':'')+'>Name Z–A</option></select>'+
   '<div class="seg"><button type="button" data-act="showArch" data-id="0" aria-pressed="'+!S.showArchived+'">Active</button><button type="button" data-act="showArch" data-id="1" aria-pressed="'+S.showArchived+'">Archived ('+arch.length+')</button></div>'+
   '</div><div class="toolbar">'+

/* ----- Daily tab ----- */
function dayTotals(date){
  var t={DTM:0,TM:0,Ghee:0},n={logged:0,pending:0,none:0};
  dueFiltered(date).forEach(function(c){
    var s=statusOf(date,c.id);n[s]++;
    if(s==='logged'){var e=entryOf(date,c.id);PRODUCTS.forEach(function(p){t[p.k]+=Number(e.qty&&e.qty[p.k])||0})}
  });
  return {t:t,n:n};
}
function draftKey(d,c,p){return d+'|'+c+'|'+p}
function draftVal(date,c,p){
  var k=draftKey(date,c.id,p);if(S.drafts[k]!==undefined)return S.drafts[k];
  var e=entryOf(date,c.id);
  if(e&&e.status==='logged'){var v=e.qty&&e.qty[p];return v==null?'':q2(v)}
  return q2(c.products[p]);
}

   '<div class="stat"><span>Entries</span><b>'+tot.n.logged+'/'+due.length+'</b><span style="letter-spacing:0;text-transform:none;font-weight:500">'+tot.n.pending+' pending · '+tot.n.none+' no order</span></div></div>';

/* ----- Monthly model & tab ----- */
function clientRow(c,days,today){
  var cells={},tot={DTM:0,TM:0,Ghee:0},ordered=0,missed=[],pOrd={DTM:0,TM:0,Ghee:0};
  days.forEach(function(d){
    var e=entryOf(d,c.id),exp=isExpected(c,d),st='off';
    if(e)st=e.status==='logged'?'logged':'none';else if(exp&&d<=today)st='missed';else if(exp)st='upcoming';
    cells[d]={e:e,st:st};
    if(st==='logged'){var any=false;PRODUCTS.forEach(function(p){var v=Number(e.qty&&e.qty[p.k])||0;tot[p.k]+=v;if(v>0){any=true;pOrd[p.k]++}});if(any)ordered++}
    if(st==='missed')missed.push(d);
  });
  return {c:c,cells:cells,tot:tot,ordered:ordered,missed:missed,pOrd:pOrd};
}
function monthModel(ym){
  var days=monthDays(ym),today=todayIso();
  var list=S.clients.filter(function(c){return !c.archived||days.some(function(d){return entryOf(d,c.id)})}).sort(byName);
  var rows=list.map(function(c){return clientRow(c,days,today)});
  var totals={DTM:0,TM:0,Ghee:0};rows.forEach(function(r){PRODUCTS.forEach(function(p){totals[p.k]+=r.tot[p.k]})});
  return {ym:ym,days:days,rows:rows,totals:totals};
}
function cellText(cell,prod){
  var e=cell.e;
  if(cell.st==='missed')return {t:'!',c:'miss'};
  if(cell.st==='none')return {t:'×',c:'none'};
  if(cell.st!=='logged')return {t:'',c:''};
  if(prod==='ALL'){return {t:PRODUCTS.map(function(p){var v=e.qty&&e.qty[p.k];return v==null?'–':q2(v)}).join('/'),c:''}}
  var v=e.qty&&e.qty[prod];return {t:v==null?'':q2(v),c:''};
}

function validateForm(){
  var e={},ok=true;
  var nm=F.name.trim();
  if(!nm){e.name='Enter the client name.';ok=false}
  else if(S.clients.some(function(c){return c.id!==F.id&&normName(c.name)===normName(nm)})){e.name='A client with this name already exists.';ok=false}
  var bn=(F.same?F.name:F.billingName).trim();if(!bn){e.billing='Enter the billing name.';ok=false}
  var ce={},cleaned=[];
  F.contacts.forEach(function(c,i){
    var filled=c.name.trim()||c.phone.trim()||c.role.trim();
    if(i===0||filled){
      var x={},ph=c.phone.replace(/[\s-]/g,'');
      if(!c.name.trim())x.name='Enter a name.';
      if(!/^\d{10}$/.test(ph))x.phone='Phone must be exactly 10 digits.';
      if(x.name||x.phone){ce[i]=x;ok=false}else cleaned.push({name:c.name.trim(),phone:ph,role:c.role.trim()});
    }
  });
  if(Object.keys(ce).length)e.contacts=ce;
  var pe={},prods={},rates={},any=false;
  PRODUCTS.forEach(function(p){var s=F.prod[p.k];if(!s.on)return;any=true;var v=s.qty===''?NaN:Number(s.qty);
    if(isNaN(v))pe[p.k]='Enter a default quantity.';else if(v<0)pe[p.k]='Quantity cannot be negative.';else if(v===0)pe[p.k]='Enter a quantity above 0.';else prods[p.k]=v;
    var rv=(s.rate===''||s.rate==null)?null:Number(s.rate);if(rv!==null){if(isNaN(rv)||rv<0){if(!pe[p.k])pe[p.k]='Enter a valid rate (0 or more), or leave it blank.'}else rates[p.k]=rv}});
  if(!any){e.prodAny='Select at least one product.';ok=false}
  if(Object.keys(pe).length){e.products=pe;ok=false}
  if(!F.days.length){e.days='Select at least one delivery day.';ok=false}
  F.err=e;
  return ok?{name:nm,billingName:bn,address:F.address.trim(),assignedTo:F.assignedTo.trim().replace(/\s+/g,' '),contacts:cleaned,products:prods,rates:rates,days:F.days.slice().sort(function(a,b){return a-b})}:null;
}

function getClient(id){return S.clients.find(function(c){return c.id===id})}
function stripId(c){var o=Object.assign({},c);delete o.id;return o}
function readDraft(date,c){
  var qty={},bad=null;
  PRODUCTS.forEach(function(p){
    if(c.products[p.k]==null)return;
    var raw=draftVal(date,c,p.k);var v=raw===''?0:Number(raw);
    if(isNaN(v)||v<0)bad=p.k;else qty[p.k]=v;
  });
  return bad?{bad:bad}:{qty:qty};
}

  switch(act){
  case 'tab':S.tab=id;if(id==='daily')ensureMonth(S.date.slice(0,7));if(id==='monthly')ensureMonth(S.month);render();window.scrollTo(0,0);break;

  case 'addClient':openForm(null);break;
  case 'editClient':openForm(getClient(id));break;
  case 'addContact':F.contacts.push({name:'',phone:'',role:''});renderForm();break;
  case 'rmContact':F.contacts.splice(Number(id),1);renderForm();break;
  case 'saveClient':{
    var p=validateForm();
    if(!p){renderForm();var er=document.querySelector('#modal .err');if(er)er.scrollIntoView({block:'center'});return}
    var old=F.id?getClient(F.id):null;
    var obj=Object.assign({},old?stripId(old):{activeFrom:todayIso(),createdAt:new Date().toISOString()},p);
    var cid=F.id||db.collection('clients').doc().id;
    if(!(await guard(saveClientDoc(cid,obj))))return;
    $('#modal').innerHTML='';F=null;toast('Client saved');break;
  }
  case 'archive':{
    var c=getClient(id);
    if(!await ask('Archive '+c.name+'?','They will disappear from the Daily Tracker. Past orders stay in monthly reports, and you can restore them any time.','Archive',false))return;
    if(!(await guard(saveClientDoc(id,Object.assign(stripId(c),{archived:true,archivedOn:todayIso()})))))return;toast('Client archived');break;
  }
  case 'restore':{
    var c2=stripId(getClient(id));c2.archived=false;delete c2.archivedOn;c2.activeFrom=todayIso();
    if(!(await guard(saveClientDoc(id,c2))))return;toast('Client restored');break;
  }
  case 'delClient':{
    var c3=getClient(id);
    if(!await ask('Delete '+c3.name+' permanently?','This cannot be undone. All past orders for this client will be removed from the monthly reports. To keep history, use Archive instead.','Delete permanently',true))return;
    if(!(await guard(deleteClientForever(id))))return;toast('Client deleted');break;
  }
  case 'masterPdf':masterPdf();break;
  case 'day':S.date=id==='today'?todayIso():addDays(S.date,Number(id));ensureMonth(S.date.slice(0,7));render();break;
  case 'saveOrder':{
    var cl=getClient(id),r=readDraft(S.date,cl);
    if(r.bad){toast('Quantity for '+r.bad+' must be a number, 0 or more.','bad');return}
    var date=S.date;
    if(!(await guard(mutateOrders(date,function(en){en[id]={status:'logged',qty:r.qty,at:new Date().toISOString()}}))))return;
    clearDrafts(date,id);toast('Saved '+cl.name);render();break;
  }
  case 'noOrder':{
    var date2=S.date;
    if(!(await guard(mutateOrders(date2,function(en){en[id]={status:'none',at:new Date().toISOString()}}))))return;
    clearDrafts(date2,id);toast('Marked: no order today');render();break;
  }
  case 'resetOrder':{
    var c4=getClient(id);
    if(!await ask('Reset entry?',c4.name+' on '+fmt(S.date)+' will go back to Pending and the logged quantities will be removed.','Reset',true))return;
    var date3=S.date;if(!(await guard(mutateOrders(date3,function(en){delete en[id]}))))return;clearDrafts(date3,id);break;
  }
  case 'mprod':S.mprod=id;render();break;
    case 'dassign':S.dAssign=id||'';render();break;
  case 'report':runReport(id);break;
  case 'loadSample':await loadSample();break;
  case 'clearSample':await clearSample();break;
  case 'backup':await backup();break;
  case 'restoreFile':document.getElementById('restoreInput').click();break;
  case 'saveSettings':{
    var name=document.getElementById('s-name').value.trim();if(!name){toast('Enter the dairy name.','bad');return}
    var units={};PRODUCTS.forEach(function(p){var v=document.getElementById('s-u-'+p.k).value.trim();units[p.k]=v||DEFAULT_UNITS[p.k]});
    if(!(await guard(saveSettings({dairyName:name,units:units}))))return;$('#modal').innerHTML='';toast('Settings saved');break;
  }
  }
}

async function restoreFrom(file){

  var d;try{d=JSON.parse(text)}catch(e){toast('That file is not a valid backup.','bad');return}
  if(!d||d.app!=='dairy-desk'||!Array.isArray(d.clients)||!Array.isArray(d.orders)){toast('That file is not a Dairy Desk backup.','bad');return}
  if(!await ask('Replace all data?','This deletes every client and order currently stored ('+S.clients.length+' clients) and replaces them with the backup ('+d.clients.length+' clients, '+d.orders.length+' order days). It cannot be undone.','Restore backup',true))return;
  toast('Restoring… please wait');
  try{
    var cs=await db.collection('clients').get(),os=await db.collection('orders').get();
    for(var i=0;i<cs.docs.length;i++){var cd=cs.docs[i].id;await enqueue(function(){return db.doc('clients/'+cd).delete()})}
    for(var j=0;j<os.docs.length;j++){var od=os.docs[j].id;await enqueue(function(){return db.doc('orders/'+od).delete()})}
    await enqueue(function(){return db.doc('settings/main').set(d.settings||{})});
    for(var a=0;a<d.clients.length;a++){var c=d.clients[a];if(!c.id||!c.name)continue;await saveClientDoc(c.id,c)}
    for(var b=0;b<d.orders.length;b++){var o=d.orders[b];if(!/^\d{4}-\d{2}-\d{2}$/.test(o.date))continue;await enqueue(function(){return db.doc('orders/'+o.date).set({date:o.date,month:o.date.slice(0,7),entries:o.entries||{}})})}
    $('#modal').innerHTML='';toast('Backup restored');
  }catch(e){toast('Restore stopped: '+errMsg(e),'bad')}
}

function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)/4294967295}
async function loadSample(){
  var today=todayIso(),start=today.slice(0,8)+'01';
  var existing={};S.clients.forEach(function(c){existing[normName(c.name)]=true});
  toast('Loading sample data…');
  try{
    var made=[];
    for(var i=0;i<SAMPLE.length;i++){
      var s=SAMPLE[i];if(existing[normName(s.name)])continue;
      var id=db.collection('clients').doc().id;
      var obj=Object.assign({},s,{sample:true,activeFrom:start,createdAt:new Date().toISOString()});
      await saveClientDoc(id,obj);made.push(Object.assign({id:id},obj));
    }
    for(var d=start;d<=today;d=addDays(d,1)){
      var ents={};
      made.forEach(function(c,ci){
        if(!isExpected(c,d))return;
        if(d===today){if(ci===0){ents[c.id]={status:'logged',qty:Object.assign({},c.products)}}return}
        var r=hash(d+c.id);
        if(r<0.10)return;
        if(r<0.17){ents[c.id]={status:'none'};return}
        var qty={};Object.keys(c.products).forEach(function(k){var f=1+(hash(d+c.id+k)-0.5)*0.3;qty[k]=Math.max(0.5,Math.round(c.products[k]*f*2)/2)});
        ents[c.id]={status:'logged',qty:qty};
      });
      if(Object.keys(ents).length){await mutateOrders(d,function(en){Object.assign(en,ents)})}
    }
    await saveSettings({sampleLoaded:true});
    $('#modal').innerHTML='';S.tab='daily';S.date=today;toast('Sample data loaded');render();
  }catch(e){toast('Could not load sample data: '+errMsg(e),'bad')}
}

  try{
    for(var i=0;i<ids.length;i++){var id=ids[i];await enqueue(function(){return db.doc('clients/'+id).delete()})}
    var all=await db.collection('orders').get();
    for(var j=0;j<all.docs.length;j++){

    }
    $('#modal').innerHTML='';toast('Sample data cleared');
  }catch(e){toast('Could not clear sample data: '+errMsg(e),'bad')}
}

function repModel(kind,ym){
  var days=monthDays(ym),today=todayIso(),title,head=[],body=[],foot=null,landscape=false,extra=null;
  if(kind==='client'){
    var c=getClient(S.repClient);if(!c)return null;
    var row=clientRow(c,days,today);
    var ps=PRODUCTS.filter(function(p){return c.products&&c.products[p.k]!=null||row.tot[p.k]>0});
    title='Client Report - '+c.name;
    head=['Date','Day'].concat(ps.map(function(p){return p.k+' ('+unit(p.k)+')'}),['Status']);
    days.forEach(function(d){
      var cell=row.cells[d],lab={logged:'Logged',none:'No order',missed:'Not logged',upcoming:'Upcoming',off:'-'}[cell.st];
      body.push([fmt(d),DOW[dow(d)-1]].concat(ps.map(function(p){return cell.st==='logged'&&cell.e.qty&&cell.e.qty[p.k]!=null?Number(cell.e.qty[p.k]):''}),[lab]));
    });
    foot=['Monthly total',''].concat(ps.map(function(p){return Math.round(row.tot[p.k]*100)/100}),[row.ordered+' days ordered']);
    return {title:title,head:head,body:body,foot:foot,landscape:false,file:'Client_'+fileSafe(c.name)+'_'+ym};
  }
  if(kind==='product')return prodModel(S.repProd,ym,days,today);
  return null;
}
function prodModel(pk,ym,days,today){
  var rows=days&&monthModel(ym).rows.filter(function(r){return (r.c.products&&r.c.products[pk]!=null)||r.tot[pk]>0});
  var head=['Client'].concat(days.map(function(d){return String(Number(d.slice(8)))}),['Total ('+unit(pk)+')','Days']);
  var body=rows.map(function(r){return [r.c.name].concat(days.map(function(d){var cl=r.cells[d];return cl.st==='logged'&&cl.e.qty&&cl.e.qty[pk]!=null&&Number(cl.e.qty[pk])!==0?Number(cl.e.qty[pk]):''}),[Math.round(r.tot[pk]*100)/100,r.pOrd[pk]])});
  var foot=['Total'].concat(days.map(function(d,i){var s=0;rows.forEach(function(r){var cl=r.cells[d];if(cl.st==='logged')s+=Number(cl.e.qty&&cl.e.qty[pk])||0});return s?Math.round(s*100)/100:''}),[Math.round(rows.reduce(function(a,r){return a+r.tot[pk]},0)*100)/100,'']);
  var p=PRODUCTS.find(function(x){return x.k===pk});
  return {title:'Product Report - '+pk+' ('+p.name+')',head:head,body:body,foot:foot,landscape:true,file:'Product_'+pk+'_'+ym};
}
function summaryModel(ym){
  var M=monthModel(ym);
  var head=['Client'].concat(PRODUCTS.map(function(p){return p.k+' ('+unit(p.k)+')'}),['Days ordered','Days not logged','Dates not logged']);
  var body=M.rows.map(function(r){return [r.c.name].concat(PRODUCTS.map(function(p){return Math.round(r.tot[p.k]*100)/100}),[r.ordered,r.missed.length,r.missed.map(function(d){return Number(d.slice(8))}).join(', ')])});
  var foot=['Total'].concat(PRODUCTS.map(function(p){return Math.round(M.totals[p.k]*100)/100}),['','','']);
  return {title:'Summary',head:head,body:body,foot:foot};
}

/* ---------- reports: output ---------- */
function frame(doc,title,sub){
  var n=doc.getNumberOfPages(),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  for(var i=1;i<=n;i++){
    doc.setPage(i);
    doc.setTextColor(20,32,43);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(S.settings.dairyName,10,13);
    doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text(title,10,19.5);
    doc.setFontSize(9);doc.setTextColor(90,100,110);doc.text(sub,W-10,13,{align:'right'});
    doc.setDrawColor(190,200,208);doc.line(10,22.5,W-10,22.5);
    doc.text('Generated on '+nowStamp(),10,H-6);doc.text('Page '+i+' of '+n,W-10,H-6,{align:'right'});
  }
}
function newPdf(land){
  if(!window.jspdf||!window.jspdf.jsPDF){toast('The PDF library did not load. Check your connection and reload.','bad');return null}
  return new window.jspdf.jsPDF({orientation:land?'landscape':'portrait',unit:'mm',format:'a4'});
}
function ptable(doc,m,opts){
  var fm=function(v){return typeof v==='number'?q2(v):(v==null?'':String(v))};
  doc.autoTable(Object.assign({
    head:[m.head],body:m.body.map(function(r){return r.map(fm)}),foot:m.foot?[m.foot.map(fm)]:undefined,
    startY:26,margin:{top:26,left:10,right:10,bottom:12},theme:'grid',
    styles:{fontSize:8,cellPadding:1.6,lineColor:[200,208,214],lineWidth:.15,textColor:[20,32,43],overflow:'linebreak'},
    headStyles:{fillColor:[21,89,193],textColor:255,halign:'center'},footStyles:{fillColor:[228,238,252],textColor:[20,32,43],fontStyle:'bold'},
    showFoot:'lastPage'
  },opts||{}));
}
function gridStyles(m){
  var cs={0:{cellWidth:34,halign:'left'}};var n=m.head.length;
  for(var i=1;i<n;i++){cs[i]={halign:'center'}}
  return {styles:{fontSize:6.5,cellPadding:1},columnStyles:cs,headStyles:{halign:'center',fillColor:[21,89,193],textColor:255}};
}
async function masterPdf(){
  var list=S.clients.filter(function(c){return !c.archived}).sort(byName);
  var doc=newPdf(true);if(!doc)return;
  var body=list.map(function(c,i){
    return [String(i+1),c.name+(c.billingName!==c.name?'\nBilling: '+c.billingName:'\nBilling: same'),c.address||'-',(c.assignedTo||'-'),
      (c.contacts||[]).map(function(x){return x.name+(x.role?' ('+x.role+')':'')+' - '+x.phone}).join('\n'),
      PRODUCTS.filter(function(p){return c.products[p.k]!=null}).map(function(p){return p.k+': '+q2(c.products[p.k])+' '+unit(p.k)+(c.rates&&c.rates[p.k]!=null?' @ Rs. '+q2(c.rates[p.k])+'/'+unitS(unit(p.k)):'')}).join('\n'),
      daysText(c.days)];
  });
  doc.autoTable({head:[['#','Client / billing name','Address','Assigned to','Contact persons','Products, default qty & rate','Delivery days']],body:body,startY:26,margin:{top:26,left:10,right:10,bottom:12},theme:'grid',
    styles:{fontSize:8,cellPadding:2,lineColor:[200,208,214],lineWidth:.15,textColor:[20,32,43],valign:'top'},headStyles:{fillColor:[21,89,193],textColor:255},
    columnStyles:{0:{cellWidth:8},1:{cellWidth:48},2:{cellWidth:48},3:{cellWidth:26},4:{cellWidth:56},5:{cellWidth:48},6:{cellWidth:43}}});
  frame(doc,'Client Master List',plural(list.length,'active client'));
  await saveFile('Client_Master_List_'+todayIso()+'.pdf',doc.output('arraybuffer'));
}
async function dailyPdf(){
  var date=S.date,due=dueFiltered(date);var doc=newPdf(false);if(!doc)return;
  var tot={DTM:0,TM:0,Ghee:0};
  var body=due.map(function(c,i){
    var st=statusOf(date,c.id),e=entryOf(date,c.id),row=[String(i+1),c.name+((c.assignedTo||'').trim()?'\nAssigned: '+c.assignedTo:'')];
    PRODUCTS.forEach(function(p){
      if(c.products[p.k]==null){row.push('-');return}
      if(st==='none'){row.push('');return}
      var v=st==='logged'?(Number(e.qty&&e.qty[p.k])||0):Number(c.products[p.k]);tot[p.k]+=v;row.push(q2(v));
    });
    row.push(st==='none'?'No order today':'');return row;
  });
  var foot=['','Daily totals'].concat(PRODUCTS.map(function(p){return q2(tot[p.k])}),['']);
  doc.autoTable({head:[['#','Client'].concat(PRODUCTS.map(function(p){return p.k+' ('+unit(p.k)+')'}),['Signature / remarks'])],body:body,foot:[foot],startY:26,margin:{top:26,left:10,right:10,bottom:12},theme:'grid',
    styles:{fontSize:10,cellPadding:3,minCellHeight:13,lineColor:[120,130,138],lineWidth:.2,textColor:[20,32,43],valign:'middle'},
    headStyles:{fillColor:[21,89,193],textColor:255,halign:'center'},footStyles:{fillColor:[228,238,252],textColor:[20,32,43],fontStyle:'bold',halign:'center'},
    columnStyles:{0:{cellWidth:9,halign:'center'},1:{cellWidth:50},2:{halign:'center',cellWidth:22},3:{halign:'center',cellWidth:22},4:{halign:'center',cellWidth:22},5:{cellWidth:'auto'}},showFoot:'lastPage'});
  frame(doc,'Daily Delivery Sheet',DOWFULL[dow(date)-1]+', '+fmt(date));
  await saveFile('Daily_Sheet_'+date+'.pdf',doc.output('arraybuffer'));
}
function csvEsc(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCsv(meta,head,body,foot){
  var lines=meta.map(function(m){return csvEsc(m)});lines.push('');lines.push(head.map(csvEsc).join(','));
  body.forEach(function(r){lines.push(r.map(csvEsc).join(','))});if(foot)lines.push(foot.map(csvEsc).join(','));
  return '﻿'+lines.join('\r\n');
}
async function runReport(spec){
  var parts=spec.split(':'),kind=parts[0],fmtk=parts[1],ym=S.month;
  if(!S.readyM[ym]){toast('Orders for this month are still loading.','bad');return}
  var sub=monthLabel(ym),meta=function(t){return [S.settings.dairyName,t,'Month: '+sub,'Generated on '+nowStamp()]};
  if(kind==='full'){
    var days=monthDays(ym),today=todayIso();
    var models=PRODUCTS.map(function(p){return prodModel(p.k,ym,days,today)});var sm=summaryModel(ym);
    var base='Full_Month_Report_'+ym;
    if(fmtk==='pdf'){
      var doc=newPdf(true);if(!doc)return;
      ptable(doc,sm,{});
      models.forEach(function(m,i){
        doc.addPage('a4','landscape');
        doc.setFontSize(11);doc.setTextColor(20,32,43);doc.text(PRODUCTS[i].k+' - '+PRODUCTS[i].name+' ('+unit(PRODUCTS[i].k)+')',10,30);
        ptable(doc,m,Object.assign({startY:34},gridStyles(m)));
      });
      frame(doc,'Full Month Report',sub);
      await saveFile(base+'.pdf',doc.output('arraybuffer'));
    }else if(fmtk==='xlsx'){
      var wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(meta('Full Month Report').map(function(x){return [x]}).concat([[]],[sm.head],sm.body,[sm.foot])),'Summary');
      models.forEach(function(m,i){XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(meta(m.title).map(function(x){return [x]}).concat([[]],[m.head],m.body,[m.foot])),PRODUCTS[i].k)});
      await saveFile(base+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}));
    }else{
      var rows=[];monthModel(ym).rows.forEach(function(r){days.forEach(function(d){var cl=r.cells[d];if(cl.st==='logged')PRODUCTS.forEach(function(p){var v=cl.e.qty&&cl.e.qty[p.k];if(v!=null&&Number(v)!==0)rows.push([r.c.name,fmt(d),p.k,Number(v),unit(p.k)])})})});
      await saveFile(base+'.csv',toCsv(meta('Full Month Report'),['Client','Date','Product','Quantity','Unit'],rows,null));
    }
    return;
  }
  var m=repModel(kind,ym);if(!m){toast('Choose a client first.','bad');return}
  var fname=m.file+'.'+fmtk;
  if(fmtk==='pdf'){
    var d2=newPdf(m.landscape);if(!d2)return;
    ptable(d2,m,m.landscape?gridStyles(m):{columnStyles:{0:{halign:'center'},1:{halign:'center'}}});
    frame(d2,m.title,sub);await saveFile(fname,d2.output('arraybuffer'));
  }else if(fmtk==='xlsx'){
    var wb2=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb2,XLSX.utils.aoa_to_sheet(meta(m.title).map(function(x){return [x]}).concat([[]],[m.head],m.body,[m.foot])),'Report');
    await saveFile(fname,XLSX.write(wb2,{type:'array',bookType:'xlsx'}));
  }else{
    await saveFile(fname,toCsv(meta(m.title),m.head,m.body,m.foot));
  }
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  if(el.disabled)return;
  var a=el.getAttribute('data-act');
  if(a==='masterPdf'){masterPdf();return}
  if(a==='dailyPdf'){dailyPdf();return}
  onAct(a,el.getAttribute('data-id'),el);
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='search'){S.q=t.value;render();return}
  if(t.dataset.draft!==undefined){S.drafts[t.dataset.draft]=t.value;return}
  if(!F)return;
  if(t.dataset.f){F[t.dataset.f]=t.value;if(t.dataset.f==='name'&&F.same){var bb=document.getElementById('f-bill');if(bb)bb.value=t.value}return}
  if(t.dataset.c){var p=t.dataset.c.split(':');F.contacts[Number(p[0])][p[1]]=t.value;return}
  if(t.dataset.pq){F.prod[t.dataset.pq].qty=t.value;return}
  if(t.dataset.pr){F.prod[t.dataset.pr].rate=t.value;return}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='restoreInput'&&t.files&&t.files[0]){restoreFrom(t.files[0]);t.value='';return}
  if(t.dataset.sel){
    var s=t.dataset.sel;
    if(s==='sort')S.sort=t.value;
    else if(s==='assign')S.assign=t.value;
    else if(s==='date'){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value)){S.date=t.value;ensureMonth(t.value.slice(0,7))}}
    else if(s==='mm'||s==='my'){var a=S.month.split('-');var y=s==='my'?t.value:a[0],m=s==='mm'?pad(t.value):a[1];S.month=y+'-'+m;ensureMonth(S.month)}
    else if(s==='repClient')S.repClient=t.value;
    else if(s==='repProd')S.repProd=t.value;
    render();return;
  }
  if(!F)return;
  if(t.dataset.same!==undefined){F.same=t.checked;if(t.checked)F.billingName=F.name;renderForm();return}
  if(t.dataset.pt){F.prod[t.dataset.pt].on=t.checked;renderForm();return}
  if(t.dataset.d){var d=Number(t.dataset.d);F.days=F.days.filter(function(x){return x!==d});if(t.checked)F.days.push(d);return}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#confirm').innerHTML){$('#modal').innerHTML='';F=null}});

/* ---------- boot ---------- */
(async function(){
  render();
  var slowT=setTimeout(function(){S.slow=true;render()},10000);
  try{if(window.claude&&window.claude.use){db=await window.claude.use('db');dl=await window.claude.use('downloads');var u=await window.claude.use('user');if(u&&u.can&&u.can('data.write')===false)S.readOnly=true}}catch(e){db=null}
  S.booted=true;
  if(!db){clearTimeout(slowT);render();return}
  subscribeBase();
  var chk=setInterval(function(){if(S.ready.clients&&S.ready.settings){clearTimeout(slowT);clearInterval(chk)}},500);
  // keep "today" correct if the page stays open past midnight IST
  var lastToday=todayIso();
  setInterval(function(){var t=todayIso();if(t!==lastToday){if(S.date===lastToday){S.date=t;ensureMonth(t.slice(0,7))}lastToday=t;render()}},60000);
})();
})();
